    <script>
      (function(){
        const io = new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('show'); }); }, {threshold:0.18});
        // observe gallery images individually
        document.querySelectorAll('header, main, .gallery-grid img, footer, .newsletter').forEach(el=>{ if(el) io.observe(el); });
      })();
    </script>

<script>
// --- Animation au scroll (fade-in fluide) ---
const fadeElements = document.querySelectorAll('.fade-in');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

fadeElements.forEach(el => observer.observe(el));
</script>
